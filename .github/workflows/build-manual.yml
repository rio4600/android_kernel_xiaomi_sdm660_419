name: Build Kernel Manual
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev zstd gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Neutron clang 24
        run: |
          curl -L https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/06092026/neutron-clang-06092026.tar.zst -o clang.tar.zst
          mkdir clang
          tar --use-compress-program=unzstd -xf clang.tar.zst -C clang

      - name: Build kernel
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          make O=out vendor/whyred-perf_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LLVM=1 LLVM_IAS=1 Image.gz-dtb

      - name: Upload Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: Image-gz-dtb
          path: out/arch/arm64/boot/Image.gz-dtb
